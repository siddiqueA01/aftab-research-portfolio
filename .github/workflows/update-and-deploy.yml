name: Update & publish research portfolio

on:
  schedule:
    - cron: '27 8 * * *'  # Daily at 08:27 UTC; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # To retain cumulative unreviewed discoveries in generated/latest.json.
  pages: write
  id-token: write

concurrency:
  group: "research-portfolio-pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication discovery and archive retention
        run: python -m unittest discover -s tests -v
      - name: Discover latest news and research
        run: python scripts/update_live.py
      - name: Save cumulative discovery data for future runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cumulative public research discoveries [skip ci]"
            git push origin HEAD:main
          fi
      - name: Assemble public website (exclude source and workflows)
        run: |
          python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
